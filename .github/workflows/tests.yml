name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cae-crm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cae
          POSTGRES_PASSWORD: cae
          POSTGRES_DB: cae_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cae -d cae_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Every test runs twice: on SQLite (as locally) and on PostgreSQL (as on Supabase).
      CAE_TEST_POSTGRES_URL: postgresql://cae:cae@localhost:5432/cae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cae-crm/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
