{# Email HTML: tables and inline styles, because many email apps ignore stylesheets. #}
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f1f4f8;font-family:Arial,Helvetica,sans-serif;color:#0f1f3d">
{% block preheader %}{% endblock %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f4f8">
  <tr><td align="center" style="padding:24px 12px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;border:1px solid #e3e8ef">
      <tr><td style="padding:22px 28px;border-bottom:1px solid #eef1f5;font-size:18px;font-weight:bold;color:#0f1f3d">{% if logo %}<img src="{{ logo }}" alt="{{ business.name }}" height="40" style="display:block;height:40px;width:auto;border:0">{% else %}{{ business.name }}{% endif %}</td></tr>
      <tr><td style="padding:26px 28px 10px;font-size:16px;line-height:1.6;color:#1f2d4a">{% block body %}{% endblock %}</td></tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px">
      <tr><td style="padding:18px 28px;font-size:12px;line-height:1.6;color:#6b7891;text-align:center">{% block footer %}{% endblock %}</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
