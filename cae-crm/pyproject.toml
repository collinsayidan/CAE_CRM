[project]
name = "cae-crm"
version = "1.0.0"
description = "UK-standard sales CRM built with Flask"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0",
    "psycopg[binary]>=3.2",  # PostgreSQL driver for DATABASE_URL
    "tzdata",  # Europe/London time zone data on hosts without a system zoneinfo
    "Pillow>=11.0",  # resizes team profile photos
    "cryptography>=43",  # encrypts integration tokens at rest
    "sentry-sdk[flask]>=2.0",  # error monitoring, when SENTRY_DSN is set
    "segno>=1.6",  # QR codes for setting up two-factor sign-in
    "fpdf2>=2.8",  # invoice and quote PDFs
]

[tool.vercel]
entrypoint = "wsgi:app"
